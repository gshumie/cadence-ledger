<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cadence-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cadence-grad)" filter="url(#shadow)" />

  <!-- Wallet Outline -->
  <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Body -->
    <rect x="112" y="132" width="288" height="248" rx="40" />
    
    <!-- Flap Line -->
    <line x1="128" y1="204" x2="384" y2="204" />
  </g>

  <!-- Clasp Latch -->
  <g>
    <rect x="312" y="244" width="88" height="64" rx="16" fill="#ffffff" />
    <!-- Clasp Cyan Insignia -->
    <circle cx="344" cy="276" r="10" fill="#06b6d4" />
  </g>
</svg>
